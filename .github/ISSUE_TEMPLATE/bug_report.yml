name: Bug 报告
description: 报告功能异常或崩溃，便于复现与修复
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**安全漏洞请勿使用本表单**，请改走 [SECURITY.md](../../SECURITY.md) 私密报告。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 1.0.0（关于页可见），或 commit hash
      placeholder: '1.0.0'
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: 安装方式
      options:
        - NSIS 安装版
        - 便携版
        - 源码 npm start
        - 其他
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - 直链 / Range 下载
        - 视频 / yt-dlp / HLS
        - BT / 磁力
        - 队列与批量操作
        - 浏览器扩展
        - 设置 / 主题 / UI
        - 本地 API
        - 打包 / 安装
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动到出现问题的最小步骤
      placeholder: |
        1. 启动 LocalDM
        2. 粘贴某类直链并添加任务
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附错误文案、状态徽章、截图说明
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段
      description: 请粘贴 userData/LocalDM/logs/app.log 相关片段，并隐去隐私路径/令牌
      render: shell
  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: |
        - OS: Windows 11 23H2
        - Node: （仅源码运行时需要）
        - 可选工具: yt-dlp / ffmpeg / aria2c 是否就绪
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过既有 Issue，没有重复
          required: true
        - label: 日志中不含 api-token、Cookie 或其他敏感信息
          required: true
