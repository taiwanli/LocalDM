name: 功能建议
description: 提议新能力或体验改进
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 描述你在什么情况下需要这个能力
      placeholder: 例如：批量任务时希望一键按分类清理已完成项
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 交互、行为或接口上的理想形态
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 目前如何绕过、为何不够用
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 下载引擎
        - 任务列表 / 工具栏
        - 设置
        - 浏览器扩展
        - API / 自动化
        - 主题 / UI
        - 打包 / 分发
        - 文档
        - 其他
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我愿意在讨论后协助测试或提交 PR
        - label: 该建议不涉及绕过付费墙、授权或他人版权保护
          required: true
